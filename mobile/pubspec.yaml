name: vewra_mobile
description: "VEWRA — Verified Content Rewards Platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management (Phase 2+)
  flutter_riverpod: ^2.6.1

  # In-App Browser & YouTube Tracking
  flutter_inappwebview: ^6.1.5

  # Networking (Phase 2+)
  dio: ^5.7.0

  # Secure Local Storage & Preferences (Phase 2+)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Biometric Authentication & Image Picker
  local_auth: ^2.3.0
  image_picker: ^1.1.2

  # Environment Configuration (Phase 2+)
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
